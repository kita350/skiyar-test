<style>
@font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/jost-cyrillic-3odd4iyl.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}

@font-face{font-family:'Noto Sans Armenian';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(../assets/fonts/noto-sans-armenian-armenian-xzhvodur.woff2) format('woff2');unicode-range:U+0308, U+0530-058F, U+2010, U+2024, U+25CC, U+FB13-FB17}
:root{
  --bg:#f4f9f8; --white:#fff; --mint:#dcf0ec; --mint-2:#bfe4dd; --ink:#0f2a2e; --muted:#557074; --line:#d6e6e3; --teal:#0c8f86; --teal-d:#0a6f68;
  --sans:"Jost","Noto Sans Armenian",system-ui,sans-serif; --gut:20px; --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:var(--ink);color:#e8f3f1;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:#9fe3d9;white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:500 18px/1 var(--sans);text-decoration:none}
.brand i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;gap:2px;flex:none}
.langs button{background:none;border:0;padding:8px 9px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--mint);color:var(--ink)}

.hero{position:relative;overflow:hidden;padding:10px 0 44px}
.panel{position:relative;display:flex;align-items:center;gap:6px;margin-top:26px;padding:14px 14px 14px 6px;border-radius:24px;background:var(--mint);overflow:hidden;max-width:520px}
.panel .art{flex:none;width:118px;height:118px}
.bub{position:relative;flex:1;min-width:0;padding:10px 12px 8px;border-radius:4px 16px 16px 16px;background:#fff;box-shadow:0 6px 18px rgba(15,42,46,.08);font-size:14px;line-height:1.4}
.bub b{display:block;margin-bottom:2px;color:var(--teal-d);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub small{display:block;text-align:right;font-size:11px;color:#53bdeb}
.hero-in{position:relative}
.kind{margin:0;display:inline-flex;align-items:center;gap:8px;color:var(--teal-d);font-weight:500;font-size:15px}
.kind:before{content:"";width:18px;height:18px;background:linear-gradient(var(--teal),var(--teal)) center/18px 6px no-repeat,linear-gradient(var(--teal),var(--teal)) center/6px 18px no-repeat}
h1{margin:14px 0 0;max-width:8.5em;font:500 clamp(46px,13.5vw,100px)/.98 var(--sans);letter-spacing:-.03em;overflow-wrap:anywhere}
[data-lang="hy"] h1{font-weight:500;font-size:clamp(32px,10vw,80px);line-height:1.08;letter-spacing:-.01em}
.lead{margin:18px 0 0;max-width:30em;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 26px;border-radius:999px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:500;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.remind{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:14.5px;color:var(--muted);max-width:28em}
.remind svg{flex:none}

section{padding:56px 0}
h2{margin:0 0 8px;font:500 clamp(30px,8vw,52px)/1.05 var(--sans);letter-spacing:-.02em}
[data-lang="hy"] h2{font-size:clamp(26px,7vw,44px);line-height:1.15;letter-spacing:0}
.sub{margin:0 0 28px;max-width:34em;color:var(--muted)}

.docs{display:grid;gap:12px}
.doc{display:grid;grid-template-columns:60px minmax(0,1fr);gap:4px 14px;align-items:center;padding:16px;border-radius:18px;background:var(--white);border:1px solid var(--line)}
.mono{grid-row:span 2;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:500 20px/1 var(--sans);letter-spacing:.02em;color:var(--teal-d);background:var(--mint);border:2px solid var(--white);box-shadow:0 0 0 2px var(--mint-2)}
.doc h3{margin:0;font:500 18px/1.25 var(--sans)}
.doc p{margin:0;font-size:14.5px;color:var(--muted)}

.prices{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--line);border-radius:18px}
.prices li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}
.prices li:last-child{border-bottom:0}
.prices li span:last-child{white-space:nowrap;font-weight:500;color:var(--teal-d)}

.book{background:var(--mint)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.step{min-width:0}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:500 16px/1.2 var(--sans)}
.step h3 span:first-child{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--mint-2);background:var(--white);cursor:pointer;font-size:15px}
.chip.dr{display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 6px}
.chip.dr i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--mint);font:500 12px/1 var(--sans);font-style:normal;color:var(--teal-d)}
.chip[aria-checked="true"],.day[aria-checked="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip[aria-checked="true"] i{background:#fff}
.chip:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:62px;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{display:grid;place-items:center;height:70px;border-radius:999px;border:1px solid var(--mint-2);background:var(--white);cursor:pointer;line-height:1.2}
.day small{font-size:12px;color:var(--muted)}
.day b{font:500 19px/1 var(--sans)}
.day[aria-checked="true"] small{color:#d7f3ef}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.times .chip{padding:0}
.summary{margin-top:28px;padding:18px;border-radius:18px;background:var(--white)}
.summary p{margin:0 0 14px}
.summary .btn{width:100%}
.note{margin:12px 0 0!important;font-size:13.5px;color:var(--muted)}

.info{display:grid;gap:12px}
.card{padding:18px;border-radius:18px;background:var(--white);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font:500 16px/1.2 var(--sans);color:var(--teal-d)}
.card table{width:100%;border-collapse:collapse}
.card td{padding:7px 0;border-bottom:1px solid var(--line)}
.card td+td{text-align:right;padding-left:12px}
.info>*{min-width:0}
.card p{margin:0}
footer{padding:28px 0 44px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (min-width:1000px){
  .hero{padding:40px 0 88px}
  .hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);column-gap:64px;align-items:start}
  .hero-in>*{grid-column:1;justify-self:start}
  .hero-in>.panel{justify-self:stretch;grid-column:2;grid-row:1/span 6;align-self:center;max-width:none;margin:0;padding:28px 28px 28px 12px;gap:14px;border-radius:32px}
  .panel .art{width:210px;height:210px}
  .bub{padding:16px 18px 10px;font-size:17px}
  .bub b{font-size:15px}
  .docs{grid-template-columns:repeat(4,1fr)!important}
  .doc{grid-template-columns:1fr;text-align:left}
  .doc .mono{grid-row:auto;margin-bottom:8px}
  .prices{display:grid;grid-template-columns:1fr 1fr;column-gap:0}
  .prices li:nth-child(odd){border-right:1px solid var(--line)}
  .prices li:nth-last-child(2){border-bottom:0}
  #book .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:56px;align-items:start}
  #book .wrap>h2,#book .wrap>.sub{grid-column:1/-1}
  #book .summary{margin-top:0;position:sticky;top:64px}
}
@media (min-width:760px){
  .hero{padding:30px 0 72px}
  .docs{grid-template-columns:1fr 1fr}
  .info{grid-template-columns:1fr 1fr}
  .days{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);overflow:visible}
}
</style>
</head>

  <section id="doctors" style="padding-top:24px">

  <section id="prices" style="padding-top:0">

  <section id="contacts">

      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><p style="margin:0" data-i="footer"></p></div></footer>
