:root{
  --bg:#f1ece3; --paper:#faf7f1; --ink:#1c2621; --green:#1f3b32; --green-2:#2d5146; --muted:#66706a; --line:#ddd4c5; --brass:#b08d57; --tuff:#c98b76;
  --serif:"Forum","Noto Serif Armenian",Georgia,serif; --sans:"Jost","Noto Sans Armenian",system-ui,sans-serif; --gut:20px; --max:1160px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:#111814;color:#ece6da;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:#e2c48f;white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:400 21px/1 var(--serif);text-decoration:none;letter-spacing:.02em}
.brand i{flex:none;width:28px;height:28px;display:grid;place-items:center}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;gap:2px;flex:none}
.langs button{background:none;border:0;padding:8px 9px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--green);color:#f1ece3}

.hero{padding:8px 0 0}
.kind{margin:0;color:var(--brass);font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
[data-lang="hy"] .kind{letter-spacing:.04em;text-transform:none;font-size:15px}
h1{margin:12px 0 0;font:400 clamp(52px,15vw,116px)/.95 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
[data-lang="hy"] h1{font-weight:400;font-size:clamp(30px,9.4vw,80px);line-height:1.1}
.lead{margin:16px 0 0;max-width:30em;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:4px;border:1px solid var(--green);background:var(--green);color:#f4efe6;font-weight:400;text-decoration:none;cursor:pointer;letter-spacing:.01em}
.btn.ghost{background:none;color:var(--green)}
.stats{display:flex;gap:22px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.stats b{display:block;font:400 28px/1 var(--serif);color:var(--ink)}
.sky{display:block;width:100%;height:auto;margin-top:18px}

section{padding:56px 0}
h2{margin:0 0 8px;font:400 clamp(36px,10vw,64px)/1 var(--serif)}
[data-lang="hy"] h2{font-size:clamp(26px,7vw,44px);line-height:1.15}
.sub{margin:0 0 22px;max-width:34em;color:var(--muted)}

.filters{display:grid;gap:10px;margin-bottom:22px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#f4efe6}
.list{display:grid;gap:16px}
.obj{display:flex;flex-direction:column;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.obj .pic{position:relative;aspect-ratio:16/10;background:#e9dfcf}
.obj .pic svg{display:block;width:100%;height:100%}
.obj .id{position:absolute;left:12px;top:12px;padding:3px 9px;border-radius:3px;background:rgba(28,38,33,.82);color:#f1ece3;font-size:12.5px;letter-spacing:.06em}
.obj .deal{position:absolute;right:12px;top:12px;padding:3px 9px;border-radius:3px;background:var(--brass);color:#fff;font-size:12.5px}
.obj .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.obj .price{font:400 27px/1.1 var(--serif)}
.obj .price small{font:300 14px/1 var(--sans);color:var(--muted)}
.obj .meta{margin:0;color:var(--ink);font-size:15.5px}
.obj .dist{margin:0;color:var(--muted);font-size:14.5px}
.obj .btn{margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}

.sell{background:var(--green);color:#efe9dd}
.sell .sub{color:#c4cfc8}
.sell .btn{background:#e2c48f;border-color:#e2c48f;color:var(--green)}
.steps3{display:grid;gap:12px;margin:0 0 24px;padding:0;list-style:none;counter-reset:s}
.steps3 li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps3 li:before{content:counter(s);flex:none;width:30px;height:30px;border:1px solid #e2c48f;border-radius:50%;display:grid;place-items:center;font:400 16px/1 var(--serif);color:#e2c48f}

.info{display:grid;gap:12px}
.card{padding:18px;border-radius:6px;background:var(--paper);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font:400 22px/1.2 var(--serif)}
.card table{width:100%;border-collapse:collapse}
.card td{padding:7px 0;border-bottom:1px solid var(--line)}
.card td+td{text-align:right;padding-left:12px}
.info>*{min-width:0}
.card p{margin:0}
.note{margin:10px 0 0!important;font-size:13.5px;color:var(--muted)}
footer{padding:28px 0 44px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (min-width:760px){
  .list{grid-template-columns:repeat(2,1fr)}
  .info{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:auto 1fr;align-items:center}
}
@media (min-width:1060px){.list{grid-template-columns:repeat(3,1fr)}}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><i aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#1f3b32" stroke-width="2"><path d="M3 12L13 4l10 8"/><path d="M6 10v12h14V10"/><path d="M11 22v-6h4v6" stroke="#b08d57"/></svg></i><span data-i="brand"></span></a>

</div>
<main>
  <div class="hero">
    <div class="wrap">
      <p class="kind" id="kind"></p>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="cta">
        <a class="btn" href="#objects" data-i="ctaObjects"></a>
        <a class="btn ghost" id="ctaWa" target="_blank" rel="noopener" data-i="ctaAsk"></a>
      </div>
      <ul class="stats">
        <li><b>120+</b><span data-i="st1"></span></li>
        <li><b>8</b><span data-i="st2"></span></li>
        <li><b>7/7</b><span data-i="st3"></span></li>
      </ul>
    </div>
    <svg class="sky" viewBox="0 0 400 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 120 L70 78 L105 92 L160 40 L196 62 L214 54 L262 92 L300 84 L400 120 V170 H0Z" fill="#e3dacb"/>
      <path d="M150 49 L160 40 L172 50 L165 48 L158 52Z" fill="#faf7f1"/>
      <g id="skyline"></g>
      <rect x="0" y="166" width="400" height="4" fill="#1f3b32"/>
    </svg>
  </div>

  <section id="objects">
    <div class="wrap">
      <h2 data-i="objTitle"></h2>
      <p class="sub" data-i="objSub"></p>
      <div class="filters">
        <div class="seg" id="dealF" role="group"></div>
        <div class="seg" id="roomF" role="group"></div>
      </div>
      <div class="list" id="objList" aria-live="polite"></div>
    </div>
  </section>

  <section class="sell">
    <div class="wrap">
      <h2 data-i="sellTitle"></h2>
      <p class="sub" data-i="sellSub"></p>
      <ol class="steps3"><li data-i="sell1"></li><li data-i="sell2"></li><li data-i="sell3"></li></ol>
      <a class="btn" id="sellWa" target="_blank" rel="noopener" data-i="sellBtn"></a>
      <p class="note" style="color:#c4cfc8" data-i="waNote"></p>
    </div>
  </section>

  <section id="contacts">
    <div class="wrap">
      <h2 data-i="contactsTitle"></h2>
      <div class="info">
        <div class="card"><h3 data-i="hoursTitle"></h3>
          <table><tr><td data-i="monSat"></td><td>10:00–19:00</td></tr><tr><td data-i="sun"></td><td data-i="byAppt"></td></tr></table></div>
        <div class="card"><h3 data-i="addrTitle"></h3><p id="addr"></p><p class="note" data-i="addrNote"></p></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><p style="margin:0" data-i="footer"></p></div></footer>

    }

    s += '<rect x="0" y="178" width="320" height="22" fill="#a9b59b"/>';

    return '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + s + "</svg>";
  }
