:root{--bg:#f3ece0;--paper:#fbf7f0;--ink:#2a2118;--muted:#6d5f50;--line:#e0d4c2;--accent:#b4532a;--serif:"Spectral","Noto Serif Armenian",Georgia,serif;--sans:"Geologica","Noto Sans Armenian",system-ui,sans-serif;--gut:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans)}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--gut)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:var(--ink);color:#f3ece0;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:#fbf7f0;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.top b{font:600 18px/1 var(--serif)}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;padding:8px 9px;border-radius:999px;font:400 14px/1 var(--sans);color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.hero{padding:28px 0 36px;border-bottom:1px solid var(--line)}
.kind{margin:0 0 10px;color:var(--accent);font-weight:500;font-size:15px}
h1{margin:0;font:300 clamp(48px,14vw,96px)/.98 var(--serif);letter-spacing:-.02em;overflow-wrap:anywhere}
.lead{margin:18px 0 0;color:var(--muted);font-size:18px;max-width:30em}
.rating{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:14px}
.rating b{color:var(--accent)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:28px 0}
.act{display:flex;flex-direction:column;gap:4px;min-height:84px;padding:16px;border-radius:16px;background:var(--paper);border:1px solid var(--line);text-decoration:none}
.act b{font-weight:600;font-size:17px}
.act small{color:var(--muted);font-size:13.5px}
.act.main{grid-column:1/-1;background:var(--ink);color:#fbf7f0;border-color:var(--ink)}
.act.main small{color:#d9cbb6}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec h2{margin:0 0 12px;font:400 30px/1.1 var(--serif)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.list li span:last-child{white-space:nowrap;color:var(--muted)}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:9px 0;border-bottom:1px solid var(--line)}
.hours td+td{text-align:right}
footer{padding:28px 0 48px;color:var(--muted);font-size:14px}
@media (min-width:700px){.acts{grid-template-columns:repeat(4,1fr)}.act.main{grid-column:auto}}
