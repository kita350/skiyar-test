<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ձեր ընկերությունը — վերանորոգում և մաքրում</title>
<meta name="description" content="Пример сайта компании по ремонту, мебели и уборке от SKIYAR: калькулятор цены, работы «до и после», заявка в WhatsApp.">
<meta name="theme-color" content="#ebe8e2">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/noto-sans-armenian-armenian-xzhvodur.woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23ffd23f%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/jost-cyrillic-3odd4iyl.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/jost-latin-w73otd4g.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Noto Sans Armenian';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(../assets/fonts/noto-sans-armenian-armenian-xzhvodur.woff2) format('woff2');unicode-range:U+0308, U+0530-058F, U+2010, U+2024, U+25CC, U+FB13-FB17}
:root{
  --bg:#ebe8e2; --paper:#f7f5f1; --ink:#1b1b1b; --muted:#5f5d58; --line:#d3cec4; --yellow:#ffd23f; --blue:#2350c8; --blue-soft:#dfe6f7;
  --sans:"Jost","Noto Sans Armenian",system-ui,sans-serif; --gut:20px; --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit} button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:var(--ink);color:#eee;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:var(--yellow);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:700 18px/1 var(--sans);text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
[data-lang="hy"] .brand{text-transform:none;letter-spacing:0}
.brand i{flex:none;width:26px;height:26px;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;gap:2px;flex:none}
.langs button{min-width:44px;min-height:44px;background:none;border:0;padding:8px 9px;font-size:14px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}

.hero{padding:6px 0 48px}
.kind{margin:0;display:inline-block;padding:3px 10px;background:var(--yellow);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
[data-lang="hy"] .kind{letter-spacing:0;text-transform:none}
h1{margin:14px 0 0;font:800 clamp(46px,13.6vw,108px)/.92 var(--sans);letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere}
[data-lang="hy"] h1{font-weight:700;font-size:clamp(28px,8.6vw,76px);line-height:1.1;letter-spacing:0;text-transform:none}
.lead{margin:16px 0 0;max-width:30em;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border:2px solid var(--ink);background:var(--ink);color:var(--yellow);font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.plan{position:relative;margin-top:28px;max-width:520px;background:var(--blue);color:#fff;padding:14px;overflow:hidden}
.plan:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px) 0 0/16px 16px}
.plan svg{position:relative;display:block;width:100%;height:auto}
.plan .est{position:absolute;right:14px;bottom:14px;padding:8px 12px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:18px;line-height:1.1;text-align:right}
.plan .est small{display:block;font-weight:500;font-size:12px}

section{padding:56px 0}
h2{margin:0 0 8px;font:800 clamp(30px,8.4vw,56px)/1 var(--sans);text-transform:uppercase;letter-spacing:-.01em}
[data-lang="hy"] h2{font-weight:700;font-size:clamp(24px,6.6vw,42px);line-height:1.15;text-transform:none;letter-spacing:0}
.sub{margin:0 0 26px;max-width:34em;color:var(--muted)}

.svcs{display:grid;gap:0;border-top:2px solid var(--ink)}
.svc{display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 14px;padding:18px 0;border-bottom:1px solid var(--line)}
.svc b.n{grid-row:span 3;font:800 15px/1 var(--sans);color:var(--blue);padding-top:5px}
.svc h3{margin:0;font:600 19px/1.25 var(--sans)}
.svc p{margin:0;color:var(--muted);font-size:15px}
.svc .pr{color:var(--ink);font-weight:600}

.calc{background:var(--ink);color:#f2efe9}
.calc .sub{color:#b9b5ad}
.box{display:grid;gap:22px}
.lbl{display:block;margin:0 0 10px;font-weight:600;font-size:15px;color:var(--yellow)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;min-height:44px;padding:6px 14px;border:1px solid #4a4843;background:transparent;color:#f2efe9;cursor:pointer;font-size:15px;line-height:1.25;text-align:left}
.chip small{display:block;font-size:12.5px;opacity:.7}
.chip[aria-checked="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.area{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.area output{font:800 34px/1 var(--sans)}
input[type=range]{width:100%;height:44px;accent-color:var(--yellow);margin:0}
.scale{display:flex;justify-content:space-between;font-size:13px;color:#b9b5ad}
.result{padding:18px;background:#2a2926;border-left:4px solid var(--yellow)}
.result .sum{display:block;font:800 clamp(32px,9vw,48px)/1.05 var(--sans);color:var(--yellow);overflow-wrap:anywhere}
.result p{margin:6px 0 14px;color:#b9b5ad;font-size:14.5px}
.result .btn{width:100%;background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.note{margin:12px 0 0!important;font-size:13.5px;color:#b9b5ad}

.works{display:grid;gap:18px}
.work{background:var(--paper);border:1px solid var(--line)}
.ba{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:16/9}
.ba>div{position:relative;overflow:hidden}
.ba span{position:absolute;left:8px;top:8px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--ink);color:#fff}
.ba .after span{background:var(--yellow);color:var(--ink)}
.before{background:
  linear-gradient(160deg,transparent 47%,#6d6760 48%,transparent 50%) 30% 20%/60% 40% no-repeat,
  linear-gradient(110deg,transparent 48%,#6d6760 49%,transparent 51%) 70% 35%/40% 30% no-repeat,
  radial-gradient(ellipse at 25% 45%,#8a8278 0 14%,transparent 15%),
  radial-gradient(ellipse at 75% 25%,#9a9186 0 10%,transparent 11%),
  linear-gradient(#a9a195 0 70%,#7a7168 70% 72%,#8c8174 72%)}
.after{background:
  linear-gradient(#fff3 0 0) 18% 18%/28% 34% no-repeat,
  linear-gradient(#cfe3ee,#e9f1f4) 18% 18%/28% 34% no-repeat,
  radial-gradient(circle at 74% 14%,#ffe08a 0 5%,transparent 6%),
  repeating-linear-gradient(90deg,#c69a6b 0 22px,#b88b5c 22px 23px) 0 100%/100% 28% no-repeat,
  linear-gradient(#f3ebdf 0 72%,#e8dccb 72%)}
.after.k2{background:
  linear-gradient(#2d4a3e,#2d4a3e) 10% 46%/80% 26% no-repeat,
  linear-gradient(#e6dccd,#e6dccd) 10% 42%/80% 5% no-repeat,
  linear-gradient(#2d4a3e,#2d4a3e) 10% 12%/80% 18% no-repeat,
  repeating-linear-gradient(90deg,#d7d2c8 0 30px,#c9c3b8 30px 31px) 0 100%/100% 28% no-repeat,
  linear-gradient(#f5f1ea 0 72%,#ddd6ca 72%)}
.after.k3{background:
  linear-gradient(#fff,#fff) 62% 56%/30% 20% no-repeat,
  linear-gradient(#bcd7dc,#bcd7dc) 14% 20%/26% 44% no-repeat,
  repeating-linear-gradient(0deg,#fff 0 18px,#e3ecee 18px 19px),
  repeating-linear-gradient(90deg,#fff 0 18px,#e3ecee 18px 19px)}
.work .cap{padding:12px 14px}
.work h3{margin:0;font:600 17px/1.3 var(--sans)}
.work p{margin:2px 0 0;font-size:14px;color:var(--muted)}

.info{display:grid;gap:12px}
.info>*{min-width:0}
.card{padding:18px;background:var(--paper);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font:700 16px/1.2 var(--sans)}
.card table{width:100%;border-collapse:collapse}
.card td{padding:7px 0;border-bottom:1px solid var(--line)}
.card td+td{text-align:right;padding-left:12px}
.card p{margin:0}
.card .note{color:var(--muted)}
footer{padding:28px 0 44px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (min-width:1000px){
  .hero{padding:30px 0 80px}
  .hero>.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px;align-items:start}
  .hero>.wrap>*{grid-column:1;justify-self:start}
  .hero>.wrap>.plan{justify-self:stretch;grid-column:2;grid-row:1/span 5;align-self:center;max-width:none;margin:0;padding:22px}
  h1{font-size:clamp(56px,7vw,100px)}
  [data-lang="hy"] h1{font-size:clamp(40px,4.2vw,60px)}
  .plan .est{right:22px;bottom:22px;font-size:24px;padding:12px 16px}
  .plan .est small{font-size:14px}
}
@media (min-width:760px){
  .box{grid-template-columns:1.2fr 1fr;align-items:start}
  .works{grid-template-columns:repeat(3,1fr)}
  .info{grid-template-columns:1fr 1fr}
  .svcs{grid-template-columns:repeat(3,1fr);gap:0 24px}
}
</style>
</head>
<body data-lang="hy">
<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><i aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 13V5l6-4 6 4v8z" fill="none" stroke="#1b1b1b" stroke-width="2"/></svg></i><span data-i="brand"></span></a>
    <div class="langs" role="group" data-i-aria="langAria">
      <button type="button" data-lang-btn="hy">Հայ</button><button type="button" data-lang-btn="ru">Рус</button><button type="button" data-lang-btn="en">Eng</button>
    </div>
  </header>
</div>
<main>
  <div class="hero">
    <div class="wrap">
      <p class="kind" id="kind"></p>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="cta">
        <a class="btn" href="#calc" data-i="ctaCalc"></a>
        <a class="btn ghost" href="#works" data-i="ctaWorks"></a>
      </div>
      <div class="plan" aria-hidden="true">
        <svg viewBox="0 0 320 170" fill="none" stroke="#fff" stroke-width="3">
          <path d="M10 10H210V160H10Z"/><path d="M210 10H310V100H210"/><path d="M110 10V90M110 120V160M10 90H80M210 60V75"/>
          <path d="M110 90a30 30 0 0 1 30 30" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="M40 10V4M180 10V4M40 7H180" stroke-width="1.2"/>
          <path d="M240 100V160H310V100" stroke-dasharray="5 5" stroke-width="1.5"/>
          <rect x="128" y="104" width="62" height="36" stroke-width="1.5"/><rect x="24" y="26" width="52" height="40" stroke-width="1.5"/>
          <text x="58" y="128" fill="#fff" stroke="none" font-family="Jost,sans-serif" font-size="16" font-weight="600">38 m²</text>
          <text x="236" y="58" fill="#fff" stroke="none" font-family="Jost,sans-serif" font-size="14" font-weight="600">14 m²</text>
          <text x="128" y="50" fill="#fff" stroke="none" font-family="Jost,sans-serif" font-size="14" font-weight="600">12 m²</text>
        </svg>
        <div class="est"><small data-i="estL"></small>≈ 1 920 000 ֏</div>
      </div>
    </div>
  </div>

  <section id="services" style="padding-top:8px">
    <div class="wrap">
      <h2 data-i="svcTitle"></h2>
      <p class="sub" data-i="svcSub"></p>
      <div class="svcs">
        <article class="svc"><b class="n">01</b><h3 data-i="s1"></h3><p data-i="s1d"></p><p class="pr" id="s1p"></p></article>
        <article class="svc"><b class="n">02</b><h3 data-i="s2"></h3><p data-i="s2d"></p><p class="pr" id="s2p"></p></article>
        <article class="svc"><b class="n">03</b><h3 data-i="s3"></h3><p data-i="s3d"></p><p class="pr" id="s3p"></p></article>
      </div>
    </div>
  </section>

  <section id="calc" class="calc">
    <div class="wrap">
      <h2 data-i="calcTitle"></h2>
      <p class="sub" data-i="calcSub"></p>
      <div class="box">
        <div>
          <span class="lbl" data-i="calcSvc"></span>
          <div class="opts" id="svcOpts" role="radiogroup"></div>
          <div style="margin-top:24px">
            <div class="area"><label class="lbl" for="area" data-i="calcArea"></label><output id="areaOut" for="area"></output></div>
            <input type="range" id="area" min="10" max="200" step="1" value="64">
            <div class="scale"><span>10 m²</span><span>200 m²</span></div>
          </div>
        </div>
        <div class="result" aria-live="polite">
          <span class="lbl" data-i="calcRes"></span>
          <b class="sum" id="sum"></b>
          <p id="formula"></p>
          <a class="btn" id="sendBtn" target="_blank" rel="noopener" data-i="sendBtn"></a>
          <p class="note" data-i="calcNote"></p>
          <p class="note" data-i="waNote"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="works">
    <div class="wrap">
      <h2 data-i="worksTitle"></h2>
      <p class="sub" data-i="worksSub"></p>
      <div class="works">
        <article class="work"><div class="ba" aria-hidden="true"><div class="before"><span data-i="before"></span></div><div class="after"><span data-i="after"></span></div></div><div class="cap"><h3 data-i="w1"></h3><p data-i="w1d"></p></div></article>
        <article class="work"><div class="ba" aria-hidden="true"><div class="before"><span data-i="before"></span></div><div class="after k2"><span data-i="after"></span></div></div><div class="cap"><h3 data-i="w2"></h3><p data-i="w2d"></p></div></article>
        <article class="work"><div class="ba" aria-hidden="true"><div class="before"><span data-i="before"></span></div><div class="after k3"><span data-i="after"></span></div></div><div class="cap"><h3 data-i="w3"></h3><p data-i="w3d"></p></div></article>
      </div>
    </div>
  </section>

  <section id="contacts" style="padding-top:0">
    <div class="wrap">
      <h2 data-i="contactsTitle"></h2>
      <div class="info">
        <div class="card"><h3 data-i="hoursTitle"></h3>
          <table><tr><td data-i="monSat"></td><td>09:00–19:00</td></tr><tr><td data-i="sun"></td><td data-i="sunH"></td></tr></table></div>
        <div class="card"><h3 data-i="addrTitle"></h3><p id="addr"></p><p class="note" data-i="addrNote"></p></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><p style="margin:0" data-i="footer"></p></div></footer>

<script src="../assets/demo.js"></script>
