<style>
:root{
  --milk:#f7efed; --paper:#fcf8f7; --sand:#efdcd8; --sand-2:#dcbdb6; --umber:#8a5a52;
  --graphite:#2c2b29; --stone:#5f5951; --line:#ddd2c3;
  --serif:"Cormorant Garamond","Noto Serif Armenian",Georgia,serif;
  --sans:"Jost","Noto Sans Armenian",system-ui,sans-serif;
  --gut:20px; --max:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--milk);color:var(--graphite);font:300 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--umber);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}

/* плашка SKIYAR */
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:var(--graphite);color:#efe7dc;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:var(--paper);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--sand-2);white-space:nowrap}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{font:500 20px/1 var(--serif);letter-spacing:.01em;text-decoration:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;padding:8px 9px;font-size:14px;color:var(--stone);cursor:pointer;border-radius:999px}
.langs button[aria-pressed="true"]{color:var(--graphite);background:var(--sand)}

/* первый экран */
.hero{display:grid;gap:28px;padding:8px 0 56px}
.kind{margin:14px 0 0;color:var(--umber);font:italic 400 24px/1.2 var(--serif)}
[data-lang="hy"] .kind{font-style:normal;font-size:19px}
h1{margin:0;font:400 clamp(52px,15vw,112px)/.92 var(--serif);letter-spacing:-.015em;overflow-wrap:anywhere}
[data-lang="hy"] h1{font-weight:300;font-size:clamp(40px,11vw,84px);line-height:1.05}
.lead{margin:22px 0 0;max-width:30em;font-size:18px;color:var(--stone)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--graphite);color:var(--paper);text-decoration:none;font-weight:400;letter-spacing:.01em;border:1px solid var(--graphite);cursor:pointer}
.btn.ghost{background:none;color:var(--graphite)}
.today{margin:22px 0 0;font-size:15px;color:var(--stone)}
.arch{border-radius:1000px 1000px 0 0;overflow:hidden;background:var(--sand)}
.arch img{width:100%;height:100%;object-fit:cover}
.hero .arch{aspect-ratio:4/5;max-height:78vh;margin:0 auto;width:100%}

section{padding:64px 0}
h2{margin:0 0 10px;font:400 clamp(38px,9vw,64px)/1 var(--serif);letter-spacing:-.01em}
[data-lang="hy"] h2{font-weight:300;font-size:clamp(30px,7vw,48px);line-height:1.15}
.sub{margin:0 0 36px;max-width:34em;color:var(--stone)}

/* прайс */
.prices{display:grid;gap:44px}
.cat h3{margin:0 0 6px;font:italic 400 28px/1.2 var(--serif);color:var(--umber)}
[data-lang="hy"] .cat h3{font-style:normal;font-size:22px}
.svc{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.svc:hover .svc-n{text-decoration:underline;text-decoration-color:var(--sand-2);text-underline-offset:4px}
.svc-n{font-weight:400}
.svc-p{white-space:nowrap;font-weight:400}
.svc-d{grid-column:1/-1;font-size:14px;color:var(--stone)}

/* мастера */
.masters{display:grid;grid-auto-flow:column;grid-auto-columns:68%;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 calc(-1*var(--gut));padding-left:var(--gut);padding-right:var(--gut);scrollbar-width:none}
.masters::-webkit-scrollbar{display:none}
.masters,.gallery{scroll-padding-inline:var(--gut)}
h1,h2,h3,.day b,.summary p{font-variant-numeric:lining-nums}
.master{scroll-snap-align:start}
.master .arch{aspect-ratio:3/4}
.master h3{margin:16px 0 2px;font:400 28px/1.1 var(--serif)}
.master p{margin:0;color:var(--stone);font-size:15px}

/* запись */
.book{background:var(--sand);border-radius:0}
.steps{display:grid;gap:34px;margin:0;padding:0;list-style:none}
.step{min-width:0}
.step h3{display:flex;gap:12px;align-items:baseline;margin:0 0 14px;font:400 26px/1.1 var(--serif)}
.step h3 span{font:400 14px/1 var(--sans);color:var(--umber)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--sand-2);background:var(--paper);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--graphite);border-color:var(--graphite);color:var(--paper)}
.chip:disabled{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.svc-opts{display:grid;gap:0;background:var(--paper);border-radius:4px;padding:0 16px}
.svc-opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:16px}
.svc-opt:last-child{border-bottom:0}
.svc-opt i{width:18px;height:18px;border-radius:50%;border:1px solid var(--umber)}
.svc-opt[aria-checked="true"] i{background:var(--graphite);border-color:var(--graphite);box-shadow:inset 0 0 0 3px var(--paper)}
.svc-opt b{font-weight:400;white-space:nowrap}
.svc-opt small{display:block;font-size:13px;color:var(--stone)}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:64px;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{display:grid;place-items:center;gap:0;height:72px;border-radius:999px;border:1px solid var(--sand-2);background:var(--paper);cursor:pointer;line-height:1.2}
.day small{font-size:12px;color:var(--stone)}
.day b{font:400 19px/1 var(--sans)}
.day[aria-checked="true"]{background:var(--graphite);border-color:var(--graphite);color:var(--paper)}
.day[aria-checked="true"] small{color:var(--sand)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.times .chip{padding:0}
.hint{margin:0;color:var(--stone);font-size:15px}
.summary{margin-top:36px;padding-top:28px;border-top:1px solid var(--sand-2)}
.summary p{margin:0 0 18px;font:300 19px/1.45 var(--sans)}
.summary .btn{width:100%}
.summary .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.summary p.note{margin:14px 0 0;font:300 14px/1.5 var(--sans);color:var(--stone)}

/* галерея */
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--gut));padding:0 var(--gut) 8px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{margin:0;scroll-snap-align:center}
.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover}

/* контакты */
.info{display:grid;gap:36px}
.info h3{margin:0 0 10px;font:italic 400 24px/1.2 var(--serif);color:var(--umber)}
[data-lang="hy"] .info h3{font-style:normal;font-size:20px}
.info p{margin:0}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:10px 0;border-bottom:1px solid var(--line)}
.hours td+td{text-align:right;white-space:nowrap}
.muted{color:var(--stone)}

footer{padding:40px 0 56px;border-top:1px solid var(--line);font-size:14px;color:var(--stone)}
footer details{margin-top:10px}
footer summary{cursor:pointer}
footer ul{margin:10px 0 0;padding-left:18px;columns:2;column-gap:28px}
footer li{break-inside:avoid;overflow-wrap:anywhere}

@media (min-width:760px){
  :root{--gut:40px}
  .masters{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:0}
  .prices{grid-template-columns:repeat(3,1fr);gap:40px}
  .info{grid-template-columns:1.2fr 1fr 1fr}
  .gallery{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);overflow:visible;margin:0;padding:0;gap:16px}
  .gallery figure:nth-child(1){grid-column:span 3;grid-row:span 2;position:relative}
  .gallery figure:nth-child(1) img{position:absolute;inset:0;aspect-ratio:auto;height:100%}
  .gallery figure{grid-column:span 3}
  .gallery figure:nth-child(n+2) img{aspect-ratio:3/2}
  .gallery figure:nth-child(n+4){grid-column:span 2}
  .gallery figure:nth-child(n+4) img{aspect-ratio:4/5}
  .book-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:56px;align-items:start}
  .steps{gap:40px}
  .days{grid-auto-flow:row;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}
  h1{font-size:clamp(88px,10vw,148px)}
  .summary{position:sticky;top:76px;margin-top:0;padding:32px;border:0;background:var(--paper)}
}
@media (min-width:960px){
  .hero{grid-template-columns:1.15fr .85fr;align-items:end;gap:64px;padding:24px 0 88px}
  .hero .arch{max-height:none;aspect-ratio:3/4}
  section{padding:96px 0}
  .lead{font-size:19px}
}
</style>
</head>
