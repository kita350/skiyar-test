<style>
@font-face{font-family:'Geologica';font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/geologica-cyrillic-wf1lep2a.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Geologica';font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/geologica-latin-ckuwe1le.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Noto Sans Armenian';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(../assets/fonts/noto-sans-armenian-armenian-xzhvodur.woff2) format('woff2');unicode-range:U+0308, U+0530-058F, U+2010, U+2024, U+25CC, U+FB13-FB17}
:root{
  --bg:#121416; --panel:#1b1f23; --panel-2:#252a30; --ink:#f3f1ea; --muted:#a3a9b0; --line:#30363d; --amber:#ffb000; --amber-ink:#1a1300;
  --sans:"Geologica","Noto Sans Armenian",system-ui,sans-serif; --gut:20px; --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:#000;color:#eee;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:var(--amber);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:700 17px/1 var(--sans);text-decoration:none;letter-spacing:.02em}
.brand i{flex:none;width:26px;height:26px;border-radius:7px;background:var(--amber);display:grid;place-items:center}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;gap:2px;flex:none}
.langs button{background:none;border:0;padding:8px 9px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}

.hero{position:relative;overflow:hidden;padding:18px 0 40px}
.hero .wheel{position:absolute;right:-104px;top:-34px;width:262px;height:262px;opacity:.9;pointer-events:none}
.hero-in{position:relative}
.tag{display:inline-flex;align-items:center;gap:8px;margin:0;padding:6px 12px;border-radius:6px;background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:14px;letter-spacing:.02em}
h1{margin:18px 0 0;max-width:9em;font:800 clamp(46px,13.5vw,104px)/.95 var(--sans);letter-spacing:-.025em;text-transform:uppercase;overflow-wrap:anywhere;text-shadow:0 2px 18px rgba(0,0,0,.5)}
[data-lang="hy"] h1{font-size:clamp(32px,10vw,84px);line-height:1.05;letter-spacing:-.01em;text-transform:none}
.lead{margin:18px 0 0;max-width:30em;color:var(--muted);font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:12px;border:1px solid var(--amber);background:var(--amber);color:var(--amber-ink);font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.today{display:flex;align-items:center;gap:8px;margin:18px 0 0;color:var(--muted);font-size:15px}
.today:before{content:"";width:8px;height:8px;border-radius:50%;background:#3ccf7a;box-shadow:0 0 0 4px rgba(60,207,122,.18)}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,#121416 14px 28px);opacity:.9}

section{padding:56px 0}
h2{margin:0 0 8px;font:700 clamp(30px,8vw,52px)/1.05 var(--sans);letter-spacing:-.015em}
[data-lang="hy"] h2{font-size:clamp(26px,7vw,44px);line-height:1.15}
.sub{margin:0 0 28px;max-width:34em;color:var(--muted)}

.svcs{display:grid;gap:10px}
.svc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"i n n" "i d p";align-items:center;gap:4px 14px;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;cursor:pointer}
.svc:hover{border-color:var(--amber)}
.svc svg{grid-area:i;width:44px;height:44px;align-self:start}
.svc-n{grid-area:n;font-weight:500;line-height:1.3}
.svc-p{grid-area:p;align-self:end;white-space:nowrap;font-weight:600;color:var(--amber);font-size:16px}
.svc-d{grid-area:d;font-size:14px;color:var(--muted);line-height:1.35}

.why{display:grid;gap:10px;margin-top:28px}
.why p{margin:0;display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
.why b{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--amber);font-weight:700;font-size:14px}

.book{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.step{min-width:0}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 16px/1.2 var(--sans)}
.step h3 span:first-child{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--amber);color:var(--amber-ink);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px}
.chip[aria-checked="true"],.day[aria-checked="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:62px;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{display:grid;place-items:center;height:70px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.2}
.day small{font-size:12px;color:var(--muted)}
.day b{font:600 19px/1 var(--sans)}
.day[aria-checked="true"] small{color:#4a3700}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.times .chip{padding:0}
.summary{margin-top:28px;padding:18px;border-radius:14px;background:var(--bg);border:1px dashed var(--line)}
.summary p{margin:0 0 14px}
.summary .btn{width:100%}
.note{margin:12px 0 0!important;font-size:13.5px;color:var(--muted)}

.info{display:grid;gap:12px}
.card{padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font:600 15px/1.2 var(--sans);color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
[data-lang="hy"] .card h3{text-transform:none;letter-spacing:0}
.card table{width:100%;border-collapse:collapse}
.card td{padding:7px 0;border-bottom:1px solid var(--line)}
.card td+td{text-align:right;padding-left:12px}
.info>*{min-width:0}
.card p{margin:0}
footer{padding:28px 0 44px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (min-width:760px){
  .hero{padding:40px 0 72px}
  .hero .wheel{right:-60px;top:-20px;width:520px;height:520px}
  .svcs{grid-template-columns:1fr 1fr}
  .why{grid-template-columns:repeat(3,1fr)}
  .info{grid-template-columns:1fr 1fr}
  .days{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);overflow:visible}
}
</style>
</head>
<body data-lang="hy">
<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><i aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1300" stroke-width="2.6" stroke-linecap="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></i><span data-i="brand"></span></a>
    <div class="langs" role="group" data-i-aria="langAria">
      <button type="button" data-lang-btn="hy">Հայ</button><button type="button" data-lang-btn="ru">Рус</button><button type="button" data-lang-btn="en">Eng</button>
    </div>
  </header>
</div>
<main>
  <div class="hero">
    <svg class="wheel" viewBox="0 0 300 300" aria-hidden="true">
      <defs><radialGradient id="tg" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#23282e"/><stop offset="100%" stop-color="#15181b"/></radialGradient></defs>
      <circle cx="150" cy="150" r="146" fill="url(#tg)"/>
      <g id="tread" stroke="#30363d" stroke-width="9" stroke-linecap="round"></g>
      <circle cx="150" cy="150" r="98" fill="#121416" stroke="#3a4148" stroke-width="3"/>
      <circle cx="150" cy="150" r="86" fill="none" stroke="#ffb000" stroke-width="3" stroke-dasharray="4 10" opacity=".7"/>
      <g fill="#2b3137" stroke="#454d55" stroke-width="2" id="spokes"></g>
      <circle cx="150" cy="150" r="26" fill="#ffb000"/>
      <circle cx="150" cy="150" r="9" fill="#121416"/>
    </svg>
    <div class="wrap hero-in">
      <p class="tag" id="kind"></p>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="cta">
        <a class="btn" href="#book" data-i="ctaBook"></a>
        <a class="btn ghost" href="#prices" data-i="ctaPrices"></a>
      </div>
      <p class="today" data-i="today"></p>
    </div>
  </div>
  <div class="stripe" aria-hidden="true"></div>

  <section id="prices">
    <div class="wrap">
      <h2 data-i="pricesTitle"></h2>
      <p class="sub" data-i="pricesSub"></p>
      <div class="svcs" id="svcList"></div>
      <div class="why">
        <p><b>1</b><span data-i="why1"></span></p>
        <p><b>2</b><span data-i="why2"></span></p>
        <p><b>3</b><span data-i="why3"></span></p>
      </div>
    </div>
  </section>

  <section id="book" class="book">
    <div class="wrap">
      <h2 data-i="bookTitle"></h2>
      <p class="sub" data-i="bookSub"></p>
      <ol class="steps">
        <li class="step"><h3><span>1</span><span data-i="step1"></span></h3><div class="opts" id="svcOpts" role="radiogroup"></div></li>
        <li class="step"><h3><span>2</span><span data-i="step2"></span></h3><div class="days" id="dayOpts" role="radiogroup"></div></li>
        <li class="step"><h3><span>3</span><span data-i="step3"></span></h3><div class="times" id="timeOpts" role="radiogroup"></div></li>
      </ol>
      <div class="summary" aria-live="polite">
        <p id="summary"></p>
        <a class="btn" id="bookBtn" target="_blank" rel="noopener" aria-disabled="true" data-i="bookBtn"></a>
        <p class="note" data-i="waNote"></p>
      </div>
    </div>
  </section>

  <section id="contacts">
    <div class="wrap">
      <h2 data-i="contactsTitle"></h2>
      <div class="info">
        <div class="card"><h3 data-i="hoursTitle"></h3>
          <table><tr><td data-i="monSat"></td><td>09:00–19:00</td></tr><tr><td data-i="sun"></td><td data-i="closed"></td></tr></table></div>
        <div class="card"><h3 data-i="addrTitle"></h3><p id="addr"></p><p class="note" data-i="addrNote"></p></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><p style="margin:0" data-i="footer"></p></div></footer>

      addrTitle: "Address", addr: "Your address goes here", addrCity: "{city}, your address goes here",
      addrNote: "With a map link, so customers get directions in one tap.",
      footer: "This is a sample website by SKIYAR. The name, prices and hours are examples." }
  };
  var LI = { hy: 0, ru: 1, en: 2 };
  // [hy, ru, en], описание [hy, ru, en], цена от, минуты, иконка
  var S = [
    [["Յուղի փոխում", "Замена масла", "Oil change"], ["Յուղ և յուղի ֆիլտր", "Масло и масляный фильтр", "Oil and oil filter"], 8000, 30, "oil"],
    [["Համակարգչային ախտորոշում", "Компьютерная диагностика", "Computer diagnostics"], ["Սխալների ընթերցում և հաշվետվություն", "Чтение ошибок и отчёт", "Error scan and a written report"], 5000, 40, "diag"],
    [["Անվադողերի փոխում", "Шиномонтаж", "Tyre change"], ["4 անիվ՝ հավասարակշռումով", "4 колеса с балансировкой", "4 wheels with balancing"], 6000, 40, "tyre"],
    [["Արգելակային բարձիկների փոխում", "Замена тормозных колодок", "Brake pad replacement"], ["Մեկ առանցք", "Одна ось", "One axle"], 12000, 60, "brake"],
    [["Անիվների անկյունների կարգավորում", "Развал-схождение", "Wheel alignment"], ["3D ստենդի վրա", "На 3D-стенде", "On a 3D alignment stand"], 7000, 45, "align"]
  ];
  var ICON = {
    oil: '<path d="M14 30h18l6-8h-6l-3 3H17l-3-3z" fill="none" stroke="#ffb000" stroke-width="2.4" stroke-linejoin="round"/><path d="M34 32c0 2-1.5 3.5-3 3.5S28 34 28 32s3-5 3-5 3 3 3 5z" fill="#ffb000"/>',
    diag: '<rect x="11" y="13" width="22" height="16" rx="3" fill="none" stroke="#ffb000" stroke-width="2.4"/><path d="M14 22h4l2-4 3 7 2-3h5" fill="none" stroke="#ffb000" stroke-width="2.2" stroke-linejoin="round"/><path d="M18 33h8" stroke="#ffb000" stroke-width="2.4" stroke-linecap="round"/>',
    tyre: '<circle cx="22" cy="22" r="11" fill="none" stroke="#ffb000" stroke-width="2.4"/><circle cx="22" cy="22" r="4.5" fill="none" stroke="#ffb000" stroke-width="2.4"/><path d="M22 11v4M22 29v4M11 22h4M29 22h4" stroke="#ffb000" stroke-width="2.4"/>',
    brake: '<circle cx="22" cy="22" r="10" fill="none" stroke="#ffb000" stroke-width="2.4"/><path d="M11 15a13 13 0 0 1 8-5M33 29a13 13 0 0 1-8 5" fill="none" stroke="#ffb000" stroke-width="4" stroke-linecap="round"/><circle cx="22" cy="22" r="3" fill="#ffb000"/>',
    align: '<path d="M15 12l-3 20M29 12l3 20" stroke="#ffb000" stroke-width="3.4" stroke-linecap="round"/><path d="M10 22h24" stroke="#ffb000" stroke-width="2" stroke-dasharray="3 3"/>'
  };
  var TIMES = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
  var sel = { s: 0, d: 0, t: -1 };

  // Рисунок колеса: протектор и спицы.
  (function () {
    var tr = document.getElementById("tread"), sp = document.getElementById("spokes"), ns = "http://www.w3.org/2000/svg";
    for (var i = 0; i < 36; i++) {
      var a = i * Math.PI / 18, l = document.createElementNS(ns, "line");
      l.setAttribute("x1", 150 + Math.cos(a) * 112); l.setAttribute("y1", 150 + Math.sin(a) * 112);
      l.setAttribute("x2", 150 + Math.cos(a + .08) * 136); l.setAttribute("y2", 150 + Math.sin(a + .08) * 136);
      tr.appendChild(l);
    }
    for (i = 0; i < 5; i++) {
      var p = document.createElementNS(ns, "path"), b = i * 72 - 90;
      p.setAttribute("d", "M150 150 L150 64 A86 86 0 0 1 " + (150 + 86 * Math.sin(Math.PI / 9)).toFixed(1) + " " + (150 - 86 * Math.cos(Math.PI / 9)).toFixed(1) + " Z");
      p.setAttribute("transform", "rotate(" + (b + 90 - 10) + " 150 150)");
      sp.appendChild(p);
    }
  })();

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function days() { var out = [], d = new Date(); d.setHours(0, 0, 0, 0); while (out.length < 7) { if (d.getDay() !== 0) out.push(new Date(d)); d.setDate(d.getDate() + 1); } return out; }
  function busy(di, ti) { return (di * 5 + ti * 3) % 7 === 0 || (di + ti) % 6 === 1; }
  function radio(box, label, on, fn, cls, dis) {
    var b = el("button", cls || "chip"); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(on));
    if (typeof label === "string") b.textContent = label; else label.forEach(function (n) { b.appendChild(n); });
    if (dis) b.disabled = true; b.addEventListener("click", fn); box.appendChild(b); return b;
  }
  function dayLabel(d, i) { var t = new Date(); t.setHours(0, 0, 0, 0); var diff = Math.round((d - t) / 864e5); return diff === 0 ? D.t("todayShort") : diff === 1 ? D.t("tomorrow") : D.cap(D.date(d, "wd")); }

  function renderList() {
    var box = document.getElementById("svcList"); box.textContent = "";
    S.forEach(function (s, i) {
      var b = el("button", "svc"); b.type = "button";
      b.innerHTML = '<svg viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="11" fill="#252a30"/>' + ICON[s[4]] + "</svg>";
      b.appendChild(el("span", "svc-n", s[0][LI[D.lang]]));
      b.appendChild(el("span", "svc-p", D.t("from", { p: D.price(s[2]) })));
      b.appendChild(el("span", "svc-d", s[1][LI[D.lang]] + " · " + D.t("min", { n: s[3] })));
      b.addEventListener("click", function () { sel.s = i; renderBook(); document.getElementById("book").scrollIntoView(); });
      box.appendChild(b);
    });
  }
  function renderBook() {
    var so = document.getElementById("svcOpts"); so.textContent = "";
    S.forEach(function (s, i) { radio(so, s[0][LI[D.lang]], sel.s === i, function () { sel.s = i; renderBook(); }); });
    var dd = days(), dOpt = document.getElementById("dayOpts"); dOpt.textContent = "";
    dd.forEach(function (d, i) {
      radio(dOpt, [el("small", null, dayLabel(d, i)), el("b", null, String(d.getDate()))], sel.d === i, function () { sel.d = i; sel.t = -1; renderBook(); }, "day");
    });
    var to = document.getElementById("timeOpts"); to.textContent = "";
    var now = new Date(), isToday = dd[sel.d].toDateString() === now.toDateString();
    TIMES.forEach(function (t, i) {
      var past = isToday && parseInt(t, 10) <= now.getHours();
      radio(to, t, sel.t === i, function () { sel.t = i; renderBook(); }, "chip", past || busy(sel.d, i));
    });
    var btn = document.getElementById("bookBtn"), sum = document.getElementById("summary");
    if (sel.t < 0) { sum.textContent = D.t("sumEmpty"); btn.setAttribute("aria-disabled", "true"); btn.removeAttribute("href"); return; }
    var v = { service: S[sel.s][0][LI[D.lang]], date: D.date(dd[sel.d], "long"), time: TIMES[sel.t] };
    sum.textContent = D.t("sumFull", v);
    v.inName = D.name ? D.t("inName") : "";
    btn.href = D.wa(D.t("waMsg", v)); btn.setAttribute("aria-disabled", "false");
  }
  document.getElementById("bookBtn").addEventListener("click", function (e) { if (this.getAttribute("aria-disabled") === "true") { e.preventDefault(); document.getElementById("timeOpts").scrollIntoView({ block: "center" }); } });

  // Если сегодня свободных часов уже нет — по умолчанию завтра.
  (function () { var now = new Date(), free = TIMES.some(function (t, i) { return parseInt(t, 10) > now.getHours() && !busy(0, i); }); if (!free && days()[0].toDateString() === now.toDateString()) sel.d = 1; })();
  D.init(I, function () {
    document.getElementById("kind").textContent = D.city() ? D.t("kindCity") : D.t("kind");
    document.getElementById("addr").textContent = D.city() ? D.t("addrCity") : D.t("addr");
    renderList(); renderBook();
  });
})();
