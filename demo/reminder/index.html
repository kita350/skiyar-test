:root{--night:#02030A;--card:#0D1221;--blue:#5296E1;--sky:#8EB2DF;--muted:#7989AA;--sans:"Geologica","Noto Sans Armenian",system-ui,sans-serif;--gut:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:#fff;font:400 17px/1.5 var(--sans)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:#0D1221;color:#c3cad8;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:#fff;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:0 var(--gut)}
.top{display:flex;justify-content:flex-end;padding:16px 0}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;padding:8px 9px;border-radius:8px;font:400 14px/1 var(--sans);color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--card);color:#fff}
.grid{display:grid;gap:36px;padding:8px 0 56px;align-items:center}
h1{margin:0 0 14px;font-weight:700;font-size:clamp(32px,8.6vw,54px);line-height:1.08;letter-spacing:-.02em}
.lead{margin:0;color:#c3cad8;font-size:18px;max-width:28em}
.facts{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.facts li{padding-left:20px;position:relative;color:#c3cad8}
.facts li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--blue)}
.phone{width:min(330px,100%);margin:0 auto;aspect-ratio:330/660;border-radius:46px;padding:10px;background:#05070f;border:1px solid rgba(82,150,225,.55)}
.scr{height:100%;border-radius:37px;overflow:hidden;background:#ece7df;display:flex;flex-direction:column;color:#10131a}
.sb{display:flex;justify-content:space-between;padding:12px 26px 6px;background:#fff;font-weight:600;font-size:13px}
.hd{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;background:#fff;border-bottom:1px solid #e3e5ea}
.av{width:36px;height:36px;border-radius:50%;background:#e9ddd0;color:#765f42;display:grid;place-items:center;font:500 16px/1 Georgia,serif}
.hd b{display:block;font-size:15px}
.hd small{display:flex;align-items:center;gap:5px;color:#11663a;font-size:12px}
.hd small::before{content:"";width:7px;height:7px;border-radius:50%;background:#25D366}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px 12px}
.day{align-self:center;padding:4px 10px;border-radius:8px;background:#fff;color:#5f6673;font-size:12px}
.msg{align-self:flex-start;max-width:88%;padding:10px 12px 6px;border-radius:14px 14px 14px 4px;background:#fff;font-size:14.5px;line-height:1.42}
.msg time{display:block;text-align:right;color:#8a909c;font-size:11px;margin-top:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #e6e8ec}
.btns span{text-align:center;color:#11663a;font-weight:700;font-size:13px;padding:4px}
.me{align-self:flex-end;max-width:80%;padding:8px 12px 6px;border-radius:14px 14px 4px 14px;background:#d4f5dd;font-size:14.5px}
.me time{display:block;text-align:right;color:#5b8a6a;font-size:11px}
.bar{margin:0 10px 12px;height:38px;border-radius:19px;background:#fff}
footer{padding:20px 0 40px;color:var(--muted);font-size:14px}
@media (min-width:860px){.grid{grid-template-columns:1fr auto;gap:72px;padding:40px 0 80px}}
</style>

    <div class="phone" aria-label="" data-i-aria="phoneAria">
      <div class="scr">
        <div class="sb"><span>18:00</span><span>●●●</span></div>
        <div class="hd"><span class="av" id="av">L</span><div><b data-i="brand"></b><small data-i="label"></small></div></div>

          <div class="me"><span data-i="yes"></span><time>18:04</time></div>
        </div>
        <div class="bar"></div>
      </div>
    </div>
  </main>
  <footer data-i="footer"></footer>
</div>
