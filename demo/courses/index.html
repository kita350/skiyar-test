:root{
  --bg:#fbf5ea; --paper:#fffdf8; --ink:#1d2a5b; --muted:#5b6283; --line:#e8dcc6; --coral:#ff6b4a; --butter:#ffd66b; --lilac:#c9c2ff; --mint:#a8e6cf;
  --serif:"EB Garamond","Noto Serif Armenian",Georgia,serif; --sans:"Geologica","Noto Sans Armenian",system-ui,sans-serif; --gut:20px; --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:56px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
#skiyar-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px var(--gut);background:var(--ink);color:#f3eee3;font:400 13px/1.35 var(--sans)}
#skiyar-bar .skb-a{flex:none;color:var(--butter);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:600 20px/1 var(--serif);text-decoration:none}
.brand i{flex:none;width:28px;height:28px;border-radius:8px 8px 8px 2px;background:var(--coral);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--sans);font-style:normal}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;gap:2px;flex:none}
.langs button{background:none;border:0;padding:8px 9px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--butter);color:var(--ink)}

.hero{padding:12px 0 48px;background:linear-gradient(transparent 31px,rgba(29,42,91,.07) 32px) 0 0/100% 32px}
.kind{margin:0;display:inline-block;padding:4px 12px;border-radius:999px;background:var(--lilac);font-size:14px;font-weight:400}
h1{margin:16px 0 0;font:500 clamp(52px,15vw,112px)/.92 var(--serif);letter-spacing:-.02em;overflow-wrap:anywhere}
h1 em{font-style:normal;color:var(--coral)}
[data-lang="hy"] h1{font-weight:500;font-size:clamp(34px,10.4vw,84px);line-height:1.08;letter-spacing:0}
.lead{margin:18px 0 0;max-width:30em;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 26px;border-radius:999px;border:2px solid var(--ink);background:var(--coral);color:#fff;font-weight:500;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.stickers{position:relative;height:200px;margin-top:30px;max-width:520px}
.st{position:absolute;padding:12px 18px;border:2px solid var(--ink);border-radius:18px;background:var(--paper);font:500 22px/1.1 var(--serif);box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.st:after{content:"";position:absolute;left:22px;bottom:-11px;width:16px;height:16px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.st.a{left:0;top:6px;background:var(--butter);transform:rotate(-5deg)}
.st.b{right:4%;top:0;background:var(--mint);transform:rotate(4deg)}
.st.c{left:22%;top:84px;background:var(--lilac);transform:rotate(2deg);font:500 17px/1.1 ui-monospace,Consolas,monospace}
.st.d{right:0;top:128px;background:var(--paper);transform:rotate(-3deg);font:400 14px/1.2 var(--sans)}
.st.d:after{display:none}
.st.d b{display:block;color:var(--coral);font-weight:600}

section{padding:56px 0}
h2{margin:0 0 8px;font:500 clamp(36px,10vw,64px)/1 var(--serif);letter-spacing:-.01em}
[data-lang="hy"] h2{font-size:clamp(26px,7vw,44px);line-height:1.15}
.sub{margin:0 0 28px;max-width:34em;color:var(--muted)}

.groups{display:grid;gap:14px}
.grp{position:relative;padding:20px;border:2px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:4px 4px 0 var(--ink)}
.grp .lbl{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500}
.grp h3{margin:10px 0 6px;font:600 25px/1.15 var(--serif)}
[data-lang="hy"] .grp h3{font-size:20px;line-height:1.3}
.grp .when{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;color:var(--muted);font-size:15px}
.grp .when span:before{content:"● ";color:var(--coral)}
.grp .row{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.grp .price{font-weight:600;font-size:18px}
.grp .price small{font-weight:300;color:var(--muted);font-size:14px}
.grp button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--butter);cursor:pointer;font-size:14.5px;font-weight:500}
.seats{font-size:13px;color:var(--coral);margin:8px 0 0}

.book{background:var(--ink);color:#f3eee3}
.book .sub{color:#c6c9dc}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.step{min-width:0}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:500 16px/1.2 var(--sans)}
.step h3 span:first-child{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--butter);color:var(--ink);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid #47528a;background:transparent;color:#f3eee3;cursor:pointer;font-size:15px;line-height:1.3;text-align:left}
.chip small{display:block;font-size:12.5px;opacity:.75}
.chip[aria-checked="true"]{background:var(--butter);border-color:var(--butter);color:var(--ink)}
.summary{margin-top:28px;padding:18px;border-radius:18px;background:#26346e}
.summary p{margin:0 0 14px}
.summary .btn{width:100%;border-color:var(--butter);box-shadow:3px 3px 0 var(--butter)}
.note{margin:12px 0 0!important;font-size:13.5px;color:#c6c9dc}

.info{display:grid;gap:12px}
.card{padding:18px;border-radius:18px;background:var(--paper);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font:600 20px/1.2 var(--serif)}
.card table{width:100%;border-collapse:collapse}
.card td{padding:7px 0;border-bottom:1px solid var(--line)}
.card td+td{text-align:right;padding-left:12px}
.info>*{min-width:0}
.card p{margin:0}
.card .note{color:var(--muted)}
footer{padding:28px 0 44px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (min-width:1000px){
  .hero>.wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);column-gap:56px;align-items:start}
  .hero>.wrap>*{grid-column:1;justify-self:start}
  .grp .lbl{align-self:flex-start}
  .hero>.wrap>.stickers{justify-self:stretch;width:100%;grid-column:2;grid-row:1/span 5;align-self:center;height:380px;max-width:none;margin:0}
  .st{font-size:34px;padding:16px 24px}
  .st.a{left:2%;top:20px}
  .st.b{right:4%;top:0}
  .st.c{left:18%;top:150px;font-size:24px}
  .st.d{right:0;top:270px;font-size:17px;padding:14px 20px}
  .groups{grid-template-columns:repeat(4,1fr)!important}
  .grp{display:flex;flex-direction:column}
  .grp .row{margin-top:auto}
  .grp .seats{margin-bottom:14px}
  #book .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:56px;align-items:start}
  #book .wrap>h2,#book .wrap>.sub{grid-column:1/-1}
  #book .summary{margin-top:0;position:sticky;top:64px}
}
@media (min-width:760px){
  .hero{padding:30px 0 72px}
  .groups{grid-template-columns:1fr 1fr}
  .info{grid-template-columns:1fr 1fr}
}
</style>
</head>

<div class="wrap">

</div>
<main>
  <div class="hero">
    <div class="wrap">
      <p class="kind" id="kind"></p>

      </div>
    </div>
  </div>

  <section id="groups">
    <div class="wrap">
      <h2 data-i="groupsTitle"></h2>
      <p class="sub" data-i="groupsSub"></p>
      <div class="groups" id="grpList"></div>
    </div>
  </section>

  <section id="book" class="book">
    <div class="wrap">
      <h2 data-i="bookTitle"></h2>
      <p class="sub" data-i="bookSub"></p>
      <ol class="steps">
        <li class="step"><h3><span>1</span><span data-i="step1"></span></h3><div class="opts" id="grpOpts" role="radiogroup"></div></li>
        <li class="step"><h3><span>2</span><span data-i="step2"></span></h3><div class="opts" id="whoOpts" role="radiogroup"></div></li>

      </ol>
      <div class="summary" aria-live="polite">
        <p id="summary"></p>
        <a class="btn" id="bookBtn" target="_blank" rel="noopener" aria-disabled="true" data-i="bookBtn"></a>
        <p class="note" data-i="waNote"></p>
      </div>
    </div>
  </section>

  <section id="contacts">
    <div class="wrap">
      <h2 data-i="contactsTitle"></h2>
      <div class="info">
        <div class="card"><h3 data-i="hoursTitle"></h3>
          <table><tr><td data-i="monFri"></td><td>10:00–21:00</td></tr><tr><td data-i="sat"></td><td>10:00–15:00</td></tr><tr><td data-i="sun"></td><td data-i="closed"></td></tr></table></div>
        <div class="card"><h3 data-i="addrTitle"></h3><p id="addr"></p><p class="note" data-i="addrNote"></p></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><p style="margin:0" data-i="footer"></p></div></footer>

  var LI = { hy: 0, ru: 1, en: 2 };
  var WD = { hy: ["Կիր", "Երկ", "Երք", "Չրք", "Հնգ", "Ուրբ", "Շբթ"], ru: ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"], en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] };
  // название [hy, ru, en], метка, цвет метки, дни недели, время, цена в месяц, мест, кто по умолчанию (0 ребёнок, 1 я)
  var G = [
    [["Անգլերեն երեխաների համար, 7–10 տարեկան", "Английский для детей 7–10 лет", "English for kids aged 7–10"], "lblKids", "#ffd66b", [1, 3], "17:00", 25000, 3, 0],
    [["Անգլերեն սկսնակների համար", "Английский с нуля", "English for beginners"], "lblStart", "#a8e6cf", [2, 4], "19:00", 25000, 5, 1],
    [["Խոսակցական անգլերեն մեծահասակների համար", "Разговорный английский для взрослых", "Conversational English for adults"], "lblAdults", "#c9c2ff", [6], "11:00", 18000, 2, 1],
    [["Python դեռահասների համար, 12–16 տարեկան", "Python для подростков 12–16 лет", "Python for teens aged 12–16"], "lblIt", "#ffb4a3", [1, 5], "18:30", 30000, 4, 0]
  ];
  var sel = { g: 0, who: 0, lvl: 0, d: -1 };

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function when(g) { return g[3].map(function (d) { return WD[D.lang][d]; }).join(", ") + " · " + g[4]; }
  function nextDates(g) { var out = [], d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1); while (out.length < 3) { if (g[3].indexOf(d.getDay()) >= 0) out.push(new Date(d)); d.setDate(d.getDate() + 1); } return out; }
  function radio(box, label, sub, on, fn) {
    var b = el("button", "chip", label); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(on));
    if (sub) b.appendChild(el("small", null, sub));
    b.addEventListener("click", fn); box.appendChild(b); return b;
  }
  function choose(i) { sel.g = i; sel.who = G[i][7]; sel.d = -1; renderBook(); }

  function renderGroups() {
    var L = LI[D.lang], box = document.getElementById("grpList"); box.textContent = "";
    G.forEach(function (g, i) {
      var c = el("article", "grp"), lb = el("span", "lbl", D.t(g[1])); lb.style.background = g[2]; c.appendChild(lb);
      c.appendChild(el("h3", null, g[0][L]));
      var w = el("p", "when"); w.appendChild(el("span", null, when(g))); c.appendChild(w);
      c.appendChild(el("p", "seats", D.t("seats", { n: g[6] })));
      var row = el("div", "row"), pr = el("span", "price", D.price(g[5]) + " ");
      pr.appendChild(el("small", null, D.t("perMonth"))); row.appendChild(pr);
      var b = el("button", null, D.t("pick")); b.type = "button";
      b.addEventListener("click", function () { choose(i); document.getElementById("book").scrollIntoView(); });
      row.appendChild(b); c.appendChild(row); box.appendChild(c);
    });
  }
  function renderBook() {
    var L = LI[D.lang], g = G[sel.g];
    var o = document.getElementById("grpOpts"); o.textContent = "";
    G.forEach(function (x, i) { radio(o, x[0][L], when(x), sel.g === i, function () { choose(i); }); });
    o = document.getElementById("whoOpts"); o.textContent = "";
    ["who1", "who2"].forEach(function (k, i) { radio(o, D.t(k), "", sel.who === i, function () { sel.who = i; renderBook(); }); });
    o = document.getElementById("lvlOpts"); o.textContent = "";
    ["lvl1", "lvl2", "lvl3"].forEach(function (k, i) { radio(o, D.t(k), "", sel.lvl === i, function () { sel.lvl = i; renderBook(); }); });
    var dd = nextDates(g); o = document.getElementById("dateOpts"); o.textContent = "";
    dd.forEach(function (d, i) { radio(o, D.cap(D.date(d, "long")), g[4], sel.d === i, function () { sel.d = i; renderBook(); }); });
    var btn = document.getElementById("bookBtn"), sum = document.getElementById("summary");
    if (sel.d < 0) { sum.textContent = D.t("sumEmpty"); btn.setAttribute("aria-disabled", "true"); btn.removeAttribute("href"); return; }
    var v = { group: g[0][L], date: D.date(dd[sel.d], "long"), time: g[4], who: D.t("who" + (sel.who + 1)), level: D.t("lvl" + (sel.lvl + 1)) };
    sum.textContent = D.t("sumFull", v);
    v.inName = D.name ? D.t("inName") : "";
    btn.href = D.wa(D.t("waMsg", v)); btn.setAttribute("aria-disabled", "false");
  }
  document.getElementById("bookBtn").addEventListener("click", function (e) { if (this.getAttribute("aria-disabled") === "true") { e.preventDefault(); document.getElementById("dateOpts").scrollIntoView({ block: "center" }); } });

  D.init(I, function () {
    document.getElementById("kind").textContent = D.city() ? D.t("kindCity") : D.t("kind");
    document.getElementById("addr").textContent = D.city() ? D.t("addrCity") : D.t("addr");
    renderGroups(); renderBook();
  });
})();
